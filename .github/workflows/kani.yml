#
# THROWAWAY fork validation for #5027 and #5026. This commit is not part of the PR.
# It replaces the 5-OS matrix with three ubuntu-24.04 jobs:
#   fail-on-main : the new tests against the compiler sources of upstream main 9461e07a
#                  (must fail with the panics reported in the issues)
#   narrow       : fmt, the new tests, neighbouring suites and clippy on the fix
#   regression   : the full scripts/kani-regression.sh on the fix
name: Kani CI
on:
  push:
    branches:
      - 'validate/**'

env:
  RUST_BACKTRACE: 1

jobs:
  fail-on-main:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Kani
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore the compiler sources of upstream main (9461e07a), keep the new tests
        run: |
          git checkout 9461e07af7ec929f050aa4192f29363c9be07779 -- kani-compiler cprover_bindings
          git status --short

      - name: Setup Kani Dependencies
        uses: ./.github/actions/setup
        with:
          os: ubuntu-24.04

      - name: Build Kani
        run: cargo build-dev

      - name: Run the new tests against main (expected to fail with the reported panics)
        run: |
          set +e
          cargo run -p compiletest --quiet -- --suite kani --mode kani --no-fail-fast --timeout 900 \
              slice_tail_padding tuple_slice_tail 2>&1 | tee fail-on-main.log
          status=${PIPESTATUS[0]}
          set -e
          echo "compiletest exit status on main: $status"
          echo "struct padding panics: $(grep -c 'Components are not in valid order for struct' fail-on-main.log || true)"
          echo "tuple fat pointer panics: $(grep -c 'Generating a slice fat pointer to' fail-on-main.log || true)"
          if [ "$status" -eq 0 ]; then echo "UNEXPECTED: the new tests pass on main"; exit 1; fi
          grep -q 'Components are not in valid order for struct' fail-on-main.log
          grep -q 'Generating a slice fat pointer to' fail-on-main.log

  narrow:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Kani
        uses: actions/checkout@v6

      - name: Setup Kani Dependencies
        uses: ./.github/actions/setup
        with:
          os: ubuntu-24.04

      - name: Format check
        run: ./scripts/kani-fmt.sh --check

      - name: Build Kani
        run: cargo build-dev

      - name: New tests
        run: |
          cargo run -p compiletest --quiet -- --suite kani --mode kani --no-fail-fast --timeout 900 \
              slice_tail_padding tuple_slice_tail

      - name: Neighbouring suites
        run: |
          cargo run -p compiletest --quiet -- --suite kani --mode kani --quiet --no-fail-fast --timeout 1200 \
              SizeAndAlignOfDst FatPointers AggregateRvalue DynTrait SliceDst UnsizedCoercion UnsizedFnParams \
              Tuple Str Slice SubSlice Structs Projection PointerOffset Pointers_OtherTypes MemPredicates \
              LayoutRandomization Repr Intrinsics

      - name: Clippy on the compiler
        run: cargo clippy -p kani-compiler --tests -- -D warnings

  regression:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Kani
        uses: actions/checkout@v6

      - name: Setup Kani Dependencies
        uses: ./.github/actions/setup
        with:
          os: ubuntu-24.04

      - name: Execute Kani regression
        run: ./scripts/kani-regression.sh
